<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PetCare</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eadcff, #ffdce9);
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.15);
        }

        .login-logo {
            text-align: center;
            font-size: 55px;
        }

        .login-box h1 {
            text-align: center;
            color: #7137d8;
            margin: 10px 0;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .login-box label {
            display: block;
            margin: 12px 0 7px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 25px;
            color: white;
            background: linear-gradient(135deg, #7137d8, #e54f92);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-submit:hover {
            transform: translateY(-2px);
        }

        .login-links {
            text-align: center;
            margin-top: 20px;
        }

        .login-links a {
            color: #7137d8;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="login-logo">🐾</div>

    <h1>Welcome Back!</h1>

    <p>Login to your PetCare account</p>

    <!-- LOGIN FORM -->
    <form action="backend/login.php" method="POST" id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button class="login-submit" type="submit">
            🔐 Login
        </button>

    </form>

    <div id="message"></div>

    <div class="login-links">

        <p>Don't have an account?</p>

        <a href="register.html">
            Create Account
        </a>

        <br><br>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
