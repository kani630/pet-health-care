<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Details - PetCare</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .details-page {
            min-height: 100vh;
            padding: 60px 8%;
            background: linear-gradient(135deg,#fff2f7,#eee8ff);
        }

        .back-link {
            color: #7137d8;
            text-decoration: none;
            font-weight: bold;
        }

        .details-card {
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,.12);
        }

        .details-image {
            width: 45%;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 180px;
            background: linear-gradient(135deg,#ffd8c5,#e8d4ff);
        }

        .details-content {
            width: 55%;
            padding: 50px;
        }

        .details-content h1 {
            font-size: 42px;
            color: #7137d8;
        }

        .details-content > p {
            color: #777;
            line-height: 1.7;
            margin: 15px 0 25px;
        }

        .pet-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-box {
            padding: 15px;
            border-radius: 12px;
            background: #f8f3ff;
        }

        .data-box b {
            display: block;
            margin-bottom: 5px;
            color: #7137d8;
        }

        .adoption-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            color: white;
            background: linear-gradient(135deg,#7137d8,#e54f92);
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width:800px) {
            .details-card {
                flex-direction: column;
            }

            .details-image,
            .details-content {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="details-page">

    <a href="pets.html" class="back-link">
        ← Back to Pets
    </a>

    <div class="details-card">

        <div class="details-image">
            🐶
        </div>

        <div class="details-content">

            <h1>Bruno 🐾</h1>

            <p>
                Bruno is a friendly Labrador looking for a
                loving forever home.
            </p>

            <div class="pet-data">

                <div class="data-box">
                    <b>Breed</b>
                    Labrador
                </div>

                <div class="data-box">
                    <b>Age</b>
                    2 Years
                </div>

                <div class="data-box">
                    <b>Gender</b>
                    Male
                </div>

                <div class="data-box">
                    <b>Health</b>
                    Healthy 💚
                </div>

                <div class="data-box">
                    <b>Vaccination</b>
                    Completed 💉
                </div>

                <div class="data-box">
                    <b>Status</b>
                    Available 🟢
                </div>

            </div>

            <a href="adoption.html" class="adoption-btn">
                ❤️ Apply for Adoption
            </a>

        </div>

    </div>

</div>

</body>
</html> No newline at end of file
